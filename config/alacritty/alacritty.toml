[general]
import = ["~/.config/alacritty/themes/noctalia.toml"]

[cursor.style]
blinking = "Always"
shape = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 14.0

[font.normal]
family = "MesloLGS Nerd Font"

[font.offset]
x = 1
y = 1

[scrolling]
history = 10000

[window]
decorations = "full"
dynamic_title = true
opacity = 0.80
startup_mode = "Windowed"
title = "Alacritty"

[window.dimensions]
columns = 120
lines = 30

[window.padding]
x = 10
y = 10
