##############################################
#                                            #
#               Cool Night Theme             #
#                                            #
##############################################

# Generated from coolnight.json using the same palette-role mapping
# as the provided Tokyo Night JSON/TOML theme pair.

# This contains the theme config file for superfile! For more details see:
# https://superfile.dev/configure/custom-theme/

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Find one you like at: https://github.com/alecthomas/chroma/blob/master/styles.

code_syntax_highlight = "catppuccin-macchiato"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#ebddf4"
full_screen_bg = "#010b17"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#1376f8", "#ae81ff"]
directory_icon_color = ""

#-- File Panel
file_panel_fg = "#ebddf4"
file_panel_bg = "#010b17"
file_panel_border = "#62686c"
file_panel_border_active = "#ae81ff"
file_panel_top_directory_icon = "#73ffd8"
file_panel_top_path = "#1376f8"
file_panel_item_selected_fg = "#ff69d7"
file_panel_item_selected_bg = "#010b17"

#-- Footer
footer_fg = "#ebddf4"
footer_bg = "#010b17"
footer_border = "#62686c"
footer_border_active = "#73ffd8"

#-- Sidebar
sidebar_fg = "#ebddf4"
sidebar_bg = "#010b17"
sidebar_title = "#73ffd8"
sidebar_border = "#1a2b39"
sidebar_border_active = "#ff3a3a"
sidebar_item_selected_fg = "#ff69d7"
sidebar_item_selected_bg = "#010b17"
sidebar_divider = "#556979"

#-- Modals
modal_fg = "#ebddf4"
modal_bg = "#010b17"
modal_border_active = "#73ffd8"
modal_cancel_fg = "#1a2b39"
modal_cancel_bg = "#fff383"
modal_confirm_fg = "#1a2b39"
modal_confirm_bg = "#52ffcf"

#-- Help Menu
help_menu_hotkey = "#ff69d7"
help_menu_title = "#73ffd8"

#-- Special
cursor = "#fcf4ad"
correct = "#52ffcf"
error = "#ff3a3a"
hint = "#ff69d7"
cancel = "#fcf4ad"
